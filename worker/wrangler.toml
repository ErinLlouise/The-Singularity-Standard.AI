name = "deadly-serious-worker"
main = "worker.js"
compatibility_date = "2024-12-01"

# The Anthropic API key is set as a secret, not a regular variable:
#   wrangler secret put ANTHROPIC_API_KEY
#
# To deploy:
#   cd worker
#   wrangler deploy
#
# After deploy, Cloudflare prints a URL like:
#   https://deadly-serious-worker.<your-name>.workers.dev
# Paste that into config.js as window.DEADLY_SERIOUS_CONFIG.workerUrl.
